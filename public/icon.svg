<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Canvas with Safe Zone Padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Decorative Ring -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Document / Bill Sheet Icon -->
  <g filter="url(#shadow)">
    <!-- Main Sheet -->
    <rect x="120" y="96" width="272" height="320" rx="20" fill="#ffffff"/>
    
    <!-- Header Fold Ribbon -->
    <path d="M 120 116 C 120 104.954 128.954 96 140 96 L 372 96 C 383.046 96 392 104.954 392 116 L 392 168 L 120 168 Z" fill="#6366f1"/>
    
    <!-- Rupee / Bill Symbol on header -->
    <circle cx="160" cy="132" r="18" fill="url(#goldGrad)"/>
    <text x="160" y="139" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#1e1b4b" text-anchor="middle">₹</text>
    
    <!-- Bill Header Text lines -->
    <rect x="194" y="122" width="120" height="8" rx="4" fill="rgba(255,255,255,0.9)"/>
    <rect x="194" y="136" width="70" height="6" rx="3" fill="rgba(255,255,255,0.7)"/>

    <!-- Bill Content Lines -->
    <rect x="150" y="194" width="212" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="150" y="216" width="160" height="8" rx="4" fill="#f1f5f9"/>
    
    <rect x="150" y="240" width="212" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="150" y="262" width="180" height="8" rx="4" fill="#f1f5f9"/>
    
    <rect x="150" y="286" width="212" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="150" y="308" width="140" height="8" rx="4" fill="#f1f5f9"/>

    <!-- Total Pill -->
    <rect x="150" y="340" width="212" height="42" rx="10" fill="#0f172a"/>
    <text x="170" y="366" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#94a3b8">TOTAL</text>
    <text x="342" y="367" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#38bdf8" text-anchor="end">₹ 14,850</text>
    
    <!-- Checkmark Seal Badge -->
    <circle cx="370" cy="390" r="28" fill="#10b981" filter="url(#shadow)"/>
    <path d="M358 390 L366 398 L382 382" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
